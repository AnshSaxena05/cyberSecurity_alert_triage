[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

# Flat layout: explicit packages (project name is soc-triage-agent, not a folder).
[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "agents",
    "components",
    "evaluation",
    "observability",
    "prompts",
    "security",
    "services",
    "tests",
]

[project]
name = "soc-triage-agent"
version = "0.1.0"
description = "Agentic SOC alert triage system using LangGraph + Pydantic"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "langsmith>=0.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "aiohttp>=3.10.0",
    "boto3>=1.34.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "langfuse>=3.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
    "rich>=13.7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
