# NATS dev-stack configuration.
#
# Single-node JetStream for local development. NOT for production — production
# uses the per-tenant credentials JWT setup that lives in infra/nats/prod/ once
# we pick the deployment target (Synadia Cloud vs self-hosted).

server_name: soc-triage-nats-dev

listen: 0.0.0.0:4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 2GB
}

websocket {
  listen: 0.0.0.0:8443
  no_tls: true
}

# In dev, allow anonymous local clients. In production this becomes a per-tenant
# user JWT with subject permissions (alerts.<tid>.>, triage.events.<tid>.>, etc.)
# enforced at the wire — see plan section B.
authorization {
  default_permissions = {
    publish = ">"
    subscribe = ">"
  }
}
